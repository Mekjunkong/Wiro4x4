    <!-- JSON-LD Structured Data -->

          "@id": "https://www.wiro4x4indochina.com/#organization",
          "name": "WIRO 4x4",

          "url": "https://www.wiro4x4indochina.com",
          "logo": "https://www.wiro4x4indochina.com/images/logo.png",
          "email": "wiro.adventures@gmail.com",
          "contactPoint": {
            "@type": "ContactPoint",
            "telephone": "+66929894495",
            "contactType": "reservations",
            "availableLanguage": ["English", "Hebrew", "Thai"]
          },
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Chiang Mai",
            "addressCountry": "TH"
          },
          "geo": {
            "@type": "GeoCoordinates",
            "latitude": 18.7883,
            "longitude": 98.9853
          },
          "openingHoursSpecification": {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday"],
            "opens": "08:00",
            "closes": "18:00"
          },
          "priceRange": "฿฿-฿฿฿",

          "@type": "TouristTrip",

        },

          "@id": "https://www.wiro4x4indochina.com/#website",
          "url": "https://www.wiro4x4indochina.com",
          "name": "WIRO 4x4",
          "inLanguage": ["en", "he"],
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://www.wiro4x4indochina.com/blog?search={search_term_string}",
            "query-input": "required name=search_term_string"

    <link rel="icon" type="image/png" href="/images/icon-192.png" />

    <title>WIRO 4x4 | Kosher Off-Road Adventures in Chiang Mai</title>

    <!-- Prevent flash of wrong theme by applying dark class before paint -->
    <script>
      (function() {
        var stored = localStorage.getItem('wiro-theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (stored === 'dark' || (!stored && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    
    <!-- DNS Prefetch & Preconnect for external resources -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://files.manuscdn.com" />
    <link rel="dns-prefetch" href="https://files.manuscdn.com" />
    <link rel="preconnect" href="https://d2xsxph8kpxj0f.cloudfront.net" />
    <link rel="dns-prefetch" href="https://d2xsxph8kpxj0f.cloudfront.net" />
    
    <!-- Preload critical hero image (LCP optimization) -->
    <link rel="preload" as="image" href="/images/optimized/banner.webp" type="image/webp"
          imagesrcset="/images/optimized/banner-sm.webp 400w, /images/optimized/banner-md.webp 800w, /images/optimized/banner-lg.webp 1600w"
          imagesizes="100vw" />
    
    <!-- Base fonts (always loaded) — DM Serif Display for headings, Source Sans 3 for body -->

      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Source+Sans+3:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap"

    </noscript>
    <!-- Hebrew fonts (Rubik + Heebo) loaded conditionally by LanguageContext when lang=he -->

    <!-- Analytics (Plausible - privacy-friendly, no cookies) -->

  </head>

    <div id="root"></div>
