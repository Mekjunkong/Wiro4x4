    <meta name="description" content="WIRO 4x4 - Premium kosher off-road tours in Chiang Mai, Northern Thailand. Hebrew-speaking guides, Shabbat-friendly scheduling, and authentic 4x4 adventures." />
    <meta name="keywords" content="Chiang Mai tours, kosher tours Thailand, 4x4 tours, off-road Chiang Mai, Israeli travelers, Hebrew guide, Shabbat tours, Northern Thailand adventures" />
    <meta name="author" content="WIRO 4x4" />

    <link rel="alternate" hreflang="en" href="https://wiro-4x4.manus.space/" />
    <link rel="alternate" hreflang="he" href="https://wiro-4x4.manus.space/?lang=he" />

    <meta name="geo.position" content="18.7883;98.9853" />
    <meta name="ICBM" content="18.7883, 98.9853" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://wiro-4x4.manus.space/#organization",
          "name": "WIRO 4x4",
          "alternateName": "WIRO 4x4 Kosher Off-Road Adventures",
          "url": "https://wiro-4x4.manus.space",
          "logo": "https://wiro-4x4.manus.space/images/logo.png",
          "contactPoint": {
            "@type": "ContactPoint",
            "telephone": "+66929894495",
            "contactType": "reservations",
            "availableLanguage": ["English", "Hebrew", "Thai"]
          },
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Chiang Mai",
            "addressCountry": "TH"
          }
        },
        {
          "@type": "TouristTrip",
          "name": "Kosher Off-Road Adventures in Chiang Mai",
          "description": "Premium kosher-friendly 4x4 off-road tours in Northern Thailand with Hebrew-speaking guides",
          "touristType": ["Jewish travelers", "Kosher travelers", "Adventure seekers"],
          "provider": {"@id": "https://wiro-4x4.manus.space/#organization"}
        },
        {
          "@type": "WebSite",
          "@id": "https://wiro-4x4.manus.space/#website",
          "url": "https://wiro-4x4.manus.space",
          "name": "WIRO 4x4",
          "inLanguage": ["en", "he"]
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "Is the food on tours kosher?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes! All meals provided during our tours are kosher. We work with certified kosher restaurants and caterers in Chiang Mai to ensure all dietary requirements are met."
              }
            },
            {
              "@type": "Question",
              "name": "How do you accommodate Shabbat observance?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "We fully respect Shabbat observance. Tours are not scheduled on Shabbat, and we can arrange Shabbat-friendly accommodations near the local Chabad house. Just let us know your needs when booking."
              }
            },
            {
              "@type": "Question",
              "name": "How safe are the off-road tours?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Safety is our top priority. All vehicles are regularly maintained and equipped with safety features. Our experienced drivers are trained in off-road driving, and we carry first-aid equipment on every tour."
              }
            },
            {
              "@type": "Question",
              "name": "What are the tour prices and what is included?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Tour prices vary based on group size, duration, and services selected. Each tour includes a 4x4 vehicle with driver, fuel, and basic insurance. Additional options like kosher meals, hotel arrangements, Hebrew-speaking guides, and attraction entries can be added. Contact us for a personalized quote."
              }
            },
            {
              "@type": "Question",
              "name": "How do I book a tour?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "You can book directly through our website using the booking form. Simply select your dates, group size, and preferred services. After submitting, our team will contact you within 24 hours to confirm details and finalize your booking."
              }
            },
            {
              "@type": "Question",
              "name": "What is your cancellation policy?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "We offer free cancellation up to 7 days before the tour date for a full refund. Cancellations within 3-7 days receive a 50% refund. Cancellations less than 3 days before the tour are non-refundable."
              }
            },
            {
              "@type": "Question",
              "name": "What group sizes do you accommodate?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "We cater to all group sizes, from couples and families to large groups of 20+. Our 4x4 vehicles typically seat 4-6 passengers each. For larger groups, we arrange multiple vehicles with coordinated itineraries."
              }
            },
            {
              "@type": "Question",
              "name": "What should I bring on the tour?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "We recommend comfortable clothing and closed-toe shoes suitable for outdoor activities. Bring sunscreen, a hat, sunglasses, and a refillable water bottle. A camera is a must for the stunning scenery!"
              }
            },
            {
              "@type": "Question",
              "name": "Do you offer Hebrew-speaking guides?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes! We have Hebrew-speaking guides available for all our tours. Our guides are knowledgeable about the local area, culture, and can communicate fluently in Hebrew and English."
              }
            },
            {
              "@type": "Question",
              "name": "Can tours be customized?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Absolutely! We specialize in custom-tailored experiences. Whether you want to visit specific destinations, need special dietary accommodations, or have a unique itinerary in mind, we will work with you to create the perfect adventure."
              }
            }
          ]
        }
      ]
    }
    </script>

    <link rel="preload" as="image" href="/images/optimized/hero-waterfall.jpg" type="image/jpeg" />
