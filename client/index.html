<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="WIRO 4x4 - Premium kosher off-road tours in Chiang Mai, Northern Thailand. Hebrew-speaking guides, Shabbat-friendly scheduling, and authentic 4x4 adventures." />
    <meta name="keywords" content="Chiang Mai tours, kosher tours Thailand, 4x4 tours, off-road Chiang Mai, Israeli travelers, Hebrew guide, Shabbat tours, Northern Thailand adventures" />
    <meta name="author" content="WIRO 4x4" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="WIRO 4x4 – Kosher Off-Road Tours Chiang Mai" />
    <meta property="og:description" content="Premium kosher off-road tours in Chiang Mai with Hebrew-speaking guides and Shabbat-friendly scheduling." />
    <meta property="og:image" content="/images/1000000136.jpg" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WIRO 4x4 – Kosher Off-Road Tours Chiang Mai" />
    <meta name="twitter:description" content="Premium kosher off-road tours in Chiang Mai with Hebrew-speaking guides and Shabbat-friendly scheduling." />
    <meta name="twitter:image" content="/images/1000000136.jpg" />
    
    <!-- Hebrew Language Support -->
    <meta name="language" content="English, Hebrew" />
    
    <link rel="icon" type="image/png" href="%VITE_APP_LOGO%" />
    <link rel="apple-touch-icon" href="%VITE_APP_LOGO%" />
    <title>%VITE_APP_TITLE%</title>
    
    <!-- DNS Prefetch & Preconnect for external resources -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Preload critical hero image (LCP optimization) -->
    <link rel="preload" as="image" href="/images/optimized/hero-waterfall.webp" type="image/webp" />
    <link rel="preload" as="image" href="/images/optimized/hero-waterfall.jpg" type="image/jpeg" />
    
    <!-- Optimized font loading with media print trick -->
    <link 
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&family=Heebo:wght@300;400;500;600;700&display=swap" 
      rel="stylesheet" 
      media="print" 
      onload="this.media='all'" 
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    </noscript>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
