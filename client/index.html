<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="WIRO 4x4 - Premium kosher off-road tours in Chiang Mai, Northern Thailand. Hebrew-speaking guides, Shabbat-friendly scheduling, and authentic 4x4 adventures." />
    <meta name="keywords" content="Chiang Mai tours, kosher tours Thailand, 4x4 tours, off-road Chiang Mai, Israeli travelers, Hebrew guide, Shabbat tours, Northern Thailand adventures" />
    <meta name="author" content="WIRO 4x4" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="WIRO 4x4 – Kosher Off-Road Tours Chiang Mai" />
    <meta property="og:description" content="Premium kosher off-road tours in Chiang Mai with Hebrew-speaking guides and Shabbat-friendly scheduling." />
    <meta property="og:image" content="/images/1000000136.jpg" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WIRO 4x4 – Kosher Off-Road Tours Chiang Mai" />
    <meta name="twitter:description" content="Premium kosher off-road tours in Chiang Mai with Hebrew-speaking guides and Shabbat-friendly scheduling." />
    <meta name="twitter:image" content="/images/1000000136.jpg" />
    
    <!-- Hebrew Language Support -->
    <meta name="language" content="English, Hebrew" />

    <!-- Canonical & Hreflang -->
    <link rel="canonical" href="https://wiro-4x4.manus.space/" />
    <link rel="alternate" hreflang="en" href="https://wiro-4x4.manus.space/" />
    <link rel="alternate" hreflang="he" href="https://wiro-4x4.manus.space/?lang=he" />

    <!-- RSS Feed -->
    <link rel="alternate" type="application/rss+xml" title="WIRO 4x4 Blog" href="/api/rss" />

    <!-- Geo Meta Tags -->
    <meta name="geo.region" content="TH-50" />
    <meta name="geo.position" content="18.7883;98.9853" />
    <meta name="ICBM" content="18.7883, 98.9853" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://wiro-4x4.manus.space/#organization",
          "name": "WIRO 4x4",
          "alternateName": "WIRO 4x4 Kosher Off-Road Adventures",
          "url": "https://wiro-4x4.manus.space",
          "logo": "https://wiro-4x4.manus.space/images/logo.png",
          "contactPoint": {
            "@type": "ContactPoint",
            "telephone": "+66929894495",
            "contactType": "reservations",
            "availableLanguage": ["English", "Hebrew", "Thai"]
          },
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Chiang Mai",
            "addressCountry": "TH"
          }
        },
        {
          "@type": "TouristTrip",
          "name": "Kosher Off-Road Adventures in Chiang Mai",
          "description": "Premium kosher-friendly 4x4 off-road tours in Northern Thailand with Hebrew-speaking guides",
          "touristType": ["Jewish travelers", "Kosher travelers", "Adventure seekers"],
          "provider": {"@id": "https://wiro-4x4.manus.space/#organization"}
        },
        {
          "@type": "WebSite",
          "@id": "https://wiro-4x4.manus.space/#website",
          "url": "https://wiro-4x4.manus.space",
          "name": "WIRO 4x4",
          "inLanguage": ["en", "he"]
        }
      ]
    }
    </script>

    <link rel="icon" type="image/png" href="/images/icon-192.png" />
    <link rel="apple-touch-icon" href="/images/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1C1C1C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="WIRO 4x4" />
    <title>%VITE_APP_TITLE%</title>
    
    <!-- DNS Prefetch & Preconnect for external resources -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Preload critical hero image (LCP optimization) -->
    <link rel="preload" as="image" href="/images/optimized/hero-wiro.webp" type="image/webp" />
    <link rel="preload" as="image" href="/images/optimized/hero-wiro.jpg" type="image/jpeg" />
    
    <!-- Optimized font loading with media print trick -->
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700;900&family=Source+Sans+3:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Rubik:wght@400;500;700&family=Heebo:wght@400;500&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700;900&family=Source+Sans+3:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Rubik:wght@400;500;700&family=Heebo:wght@400;500&display=swap" rel="stylesheet" />
    </noscript>

    <!-- Analytics (Plausible - privacy-friendly, no cookies) -->
    <script defer data-domain="wiro4x4indochina.com" src="https://plausible.io/js/script.js"></script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
