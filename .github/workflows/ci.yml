name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: wiro_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Sync database schema for tests
        run: pnpm exec drizzle-kit push --force
        env:
          DATABASE_URL: mysql://root:test@localhost:3306/wiro_test

      - name: Run tests
        run: pnpm test
        env:
          DATABASE_URL: mysql://root:test@localhost:3306/wiro_test

      - name: Build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: ci

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: wiro_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Sync database schema for E2E
        run: pnpm exec drizzle-kit push --force
        env:
          DATABASE_URL: mysql://root:test@localhost:3306/wiro_test

      - name: Build
        run: pnpm build

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          CI: true
          DATABASE_URL: mysql://root:test@localhost:3306/wiro_test
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          R2_ACCOUNT_ID: e2e-r2-account
          R2_ACCESS_KEY_ID: e2e-r2-key-id
          R2_SECRET_ACCESS_KEY: e2e-r2-secret-key
          R2_BUCKET_NAME: e2e-bucket
          R2_PUBLIC_URL: https://e2e-bucket.example.com
          OWNER_EMAIL: e2e@example.com
